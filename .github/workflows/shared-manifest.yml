# SHARED.sha256 names the files that three deployments copy out of this repo.
#
# This workflow REGENERATES it rather than checking it, and the asymmetry is
# deliberate. This repo is the source of truth: its hashes are by definition
# whatever its tree says, so a --check failure here would only ever mean that a
# human forgot to run a script, with the same fix every time. In a CONSUMER repo
# the same mismatch means somebody hand-edited a deployed renderer, which is a
# real event needing a person — so --check keeps its strict verb in action.yml,
# where it earns its keep.
name: shared manifest

on:
  push:
    branches: [master]
  # Not pull_request: there is nothing useful to commit there.
  # Dispatch is here so the no-op path can be exercised on an unchanged tree
  # without inventing a commit to carry it.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Queue rather than cancel: a superseded run here has usually already
  # committed, so cancelling one mid-push is how you lose a manifest update.
  group: shared-manifest
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate SHARED.sha256 if the tree moved
    runs-on: ubuntu-latest
    steps:
      # Full history: the push-retry below rebases onto origin/master, which a
      # depth-1 clone cannot do.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate, and commit only if it moved
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          attempt=1
          while [ "$attempt" -le 3 ]; do

            if [ -f SHARED.sha256 ]; then
              cp SHARED.sha256 /tmp/prev.sha256
            else
              : > /tmp/prev.sha256
            fi
            prev_count="$(grep -c . /tmp/prev.sha256 || true)"

            python3 scripts/shared-manifest.py --write

            if git diff --quiet -- SHARED.sha256; then
              echo "SHARED.sha256 already matches the tree — nothing to commit."
              exit 0
            fi

            new_count="$(grep -c . SHARED.sha256 || true)"

            # The one failure a self-healing workflow could otherwise hide. A file
            # dropping off the list silently narrows what EVERY consumer verifies,
            # and it looks identical to a successful run. Same reasoning as
            # valedalama/vdl-orgdev's refresh-graph.yml refusing to commit a graph
            # that "looks like a tiny org": better to fail than to publish a
            # quieter truth.
            if [ "$new_count" -lt "$prev_count" ]; then
              echo "::error::Refusing to commit: SHARED.sha256 would drop from ${prev_count} files to ${new_count}. A file leaving the manifest narrows what every consumer checks, so it needs a human. If the removal is intended, edit SHARED_FILES in scripts/shared-manifest.py and commit the regenerated manifest by hand."
              exit 1
            fi

            # Name what moved, so the commit body says why it exists.
            {
              awk 'NR==FNR { old[$2] = $1; next }
                   !($2 in old)      { print "  added   " $2; next }
                   old[$2] != $1     { print "  changed " $2 }' /tmp/prev.sha256 SHARED.sha256
              awk 'NR==FNR { new[$2] = $1; next }
                   !($2 in new)      { print "  removed " $2 }' SHARED.sha256 /tmp/prev.sha256
            } > /tmp/moved.txt

            {
              echo "chore: refresh SHARED.sha256"
              echo
              cat /tmp/moved.txt
              echo
              echo "Regenerated by the shared manifest workflow for ${GITHUB_SHA}."
            } > /tmp/msg.txt

            git add SHARED.sha256
            git commit -q -F /tmp/msg.txt

            if git push -q origin HEAD:master; then
              echo "Committed:"
              cat /tmp/moved.txt
              exit 0
            fi

            # A rejection here is not a mystery and not a lost race to report: it
            # means another push landed while we were working. Reset onto it and
            # regenerate — the manifest describes the tip, so there is nothing in
            # our commit worth rebasing.
            echo "Push rejected — another commit landed first. Rebuilding on it (attempt ${attempt} of 3)."
            git fetch -q origin master
            git reset -q --hard origin/master
            attempt=$((attempt + 1))
          done

          echo "::error::Could not publish SHARED.sha256 after 3 attempts; master kept moving underneath this run."
          exit 1

      # Kept, and placed AFTER the regenerate on purpose. It restates the promise
      # the format makes to consumers — verifiable with no code of ours — and it
      # independently cross-checks our Python against coreutils on the very file
      # this run just published.
      - name: Verify the same manifest with sha256sum
        run: sha256sum -c SHARED.sha256
